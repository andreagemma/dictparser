[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-dictparser"
dynamic = ["version"]
description = "Read a dictionary or JSON/YAML file with dynamic parameters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [ 
	{ name = "Andrea Gemma", email = "andrea.gemma@gmail.com" } 
]
keywords = ["configuration", "dictionary", "json", "parser", "dynamic", "parameters"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Front-Ends",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  'pyyaml>=6.0.3',
]
[project.scripts]
dictparser = "dictparser.__main__:main"
[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1"
]

[project.urls]
Documentation = "https://github.com/andreagemma/dictparser#readme"
Issues = "https://github.com/andreagemma/dictparser/issues"
Source = "https://github.com/andreagemma/dictparser"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictparser = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "dictparser.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["dictparser"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "src/dictparser.egg-info",
  "venv",
  "wheel-smoke-test"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/dictparser"]
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
]
ignore_errors = true
